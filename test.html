<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>My Institution Calendar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }
      #calendar {
        max-width: 900px;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <h1>📅 Institution Calendar (2025)</h1>
    <div id="calendar"></div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const calendarEl = document.getElementById("calendar");

        const calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: "dayGridMonth",
          headerToolbar: {
            left: "prev,next today",
            center: "title",
            right: "dayGridMonth,timeGridWeek",
          },
          events: [
            // Public Holidays
            {
              title: "Christmas 🎄",
              start: "2025-12-25",
              color: "red",
            },
            {
              title: "Boxing Day 🥊",
              start: "2025-12-26",
              color: "red",
            },
            // Event Occurrences
            {
              title: "Now",
              start: "2025-07-23",
              color: "blue",
            },
            {
              title: "Board of Directors Meeting",
              start: "2025-07-30",
              color: "blue",
            },
            {
              title: "Board of Directors Meeting",
              start: "2025-08-30",
              color: "blue",
            },
            {
              title: "Board of Directors Meeting",
              start: "2025-09-30",
              color: "blue",
            },
            {
              title: "Board of Directors Meeting",
              start: "2025-10-30",
              color: "blue",
            },
            {
              title: "Board of Directors Meeting",
              start: "2025-11-30",
              color: "blue",
            },
            {
              title: "Board of Directors Meeting",
              start: "2025-12-30",
              color: "blue",
            },
          ],
        });

        calendar.render();
      });
    </script>
  </body>
</html>
